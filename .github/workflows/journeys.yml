name: Journeys
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: journeys-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  workspace-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/journeys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/journeys/package-lock.json
      - run: npm ci
      - name: Install the locked Chromium runtime
        run: npm exec playwright install -- --with-deps chromium
      - name: Native workspace contracts without a database
        run: npm exec playwright test -- --config=playwright.service-state.config.ts
      - name: Public entries on a backend-disabled Next server
        run: npm exec playwright test -- --config=playwright.public-entry.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: journeys-workspace-fixture-results
          path: |
            apps/journeys/evidence/service-state-browser/
            apps/journeys/evidence/public-entry-browser/
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/journeys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/journeys/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p source_package_test.py
      - name: Read-only production source and mapped-input contracts (owned HTTP fixture only)
        run: python -m unittest discover -s ../../scripts -p verify_journeys_production_test.py -v
      - name: Owned CI concurrency and cancellation contracts
        run: node --test ../../scripts/journeys-workflow-test.mjs
      - name: Deployment scope native contracts (metadata only)
        run: |
          set -o pipefail
          mkdir -p evidence/ci
          python ../../scripts/deployment_scope_test.py -v 2>&1 | tee evidence/ci/deployment-scope-tests.log
      - run: node scripts/ci-evidence.mjs unit
      - run: npm run build
      - run: npm run typecheck
      - name: Rebuild distributed corresponding source
        run: |
          python -m zipfile -e public/source/kinnsoos-source.zip "$RUNNER_TEMP/kinnso-source"
          cd "$RUNNER_TEMP/kinnso-source"
          npm ci
          npm test
          npm run build
          npm run typecheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: journeys-verification-summary
          path: |
            apps/journeys/evidence/ci/*.json
            apps/journeys/evidence/ci/deployment-scope-tests.log
          if-no-files-found: warn
  connected:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/journeys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/journeys/package-lock.json
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.107.0
      - name: Prepare the isolated CI target
        run: node scripts/prepare-connected-ci.mjs config
      - name: Start current local migrations without sample seeds
        run: supabase start --workdir ../../.local-private/connected-ci-stack
      - name: Derive local test environment after ownership verification
        run: node scripts/prepare-connected-ci.mjs env
      - run: node scripts/ci-evidence.mjs integration
      - run: npm run build
      - name: Install Chromium and required system dependencies
        timeout-minutes: 15
        run: npm exec playwright install -- --with-deps chromium
      - name: New-site creator and connected UAT flows
        run: node scripts/ci-evidence.mjs browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: journeys-connected-summary
          path: apps/journeys/evidence/ci/*.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: journeys-connected-local-results
          path: apps/journeys/evidence/connected-browser/
  auth-mailbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/journeys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/journeys/package-lock.json
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.107.0
      - name: Prepare a fresh local confirmation and SMTP capture profile
        run: node scripts/prepare-connected-ci.mjs config-mailbox
      - name: Start owned local Auth and Mailpit without application seeds
        run: supabase start --workdir ../../.local-private/connected-ci-stack
      - name: Verify local SMTP ownership and required confirmation
        run: node scripts/prepare-connected-ci.mjs env-mailbox
      - run: npm run build
      - name: Install Chromium and system dependencies
        timeout-minutes: 15
        run: npm exec playwright install -- --with-deps chromium
      - name: Actual local signup and recovery emails in both languages
        run: node scripts/ci-evidence.mjs auth-mailbox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: journeys-auth-mailbox-summary
          path: apps/journeys/evidence/ci/auth-mailbox.json
          if-no-files-found: warn

  operations-performance:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/journeys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/journeys/package-lock.json
      - run: npm ci
      - run: npm ci --prefix scripts/performance --ignore-scripts
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.107.0
      - name: Prepare owned isolated operations lab
        run: node scripts/prepare-connected-ci.mjs config
      - name: Start fresh localhost migrations without sample seeds
        run: supabase start --workdir ../../.local-private/connected-ci-stack
      - name: Verify local ownership before deriving lab credentials
        run: node scripts/prepare-connected-ci.mjs env
      - run: npm run build
      - name: Install the locked Chromium runtime
        run: npm exec playwright install -- --with-deps chromium
      - name: Collect complete operations warm-read baseline without inventing budgets
        run: node scripts/performance/run-latency.mjs --operations
      - name: Collect all traveller and private workspace cold/warm navigation evidence
        if: ${{ !cancelled() }}
        run: node scripts/performance/run.mjs --operations
      - name: Enforce independent first-usable evidence
        if: ${{ !cancelled() }}
        run: |
          report=$(python -c 'import glob,json; rows=[p for p in glob.glob("evidence/performance/*/report.json") if json.load(open(p)).get("kind")=="operations"]; assert len(rows)==1, "Exactly one operations report required"; print(rows[0])')
          node scripts/performance/first-usable.mjs "$report" "$GITHUB_SHA"
      - name: Enforce the source-bound operations assessment
        if: ${{ !cancelled() }}
        env:
          CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          report=$(python -c 'import glob,json; rows=[p for p in glob.glob("evidence/performance/*/report.json") if json.load(open(p)).get("kind")=="operations"]; assert len(rows)==1, "Exactly one retained operations report is required"; print(rows[0])')
          node scripts/performance/assert-operations-assessment.mjs "$report" "$GITHUB_SHA" "$CANDIDATE_HEAD" "$CANDIDATE_BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: journeys-operations-performance
          path: apps/journeys/evidence/performance/
          if-no-files-found: error
