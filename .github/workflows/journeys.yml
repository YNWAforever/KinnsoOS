name: Journeys
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/journeys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/journeys/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p source_package_test.py
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Rebuild distributed corresponding source
        run: |
          python -m zipfile -e public/source/kinnsoos-source.zip "$RUNNER_TEMP/kinnso-source"
          cd "$RUNNER_TEMP/kinnso-source"
          npm ci
          npm run build
          npm run typecheck
