name: Deployment scope (metadata only)
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployment-scope-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: false
jobs:
  explain:
    # This independent record leaves existing runtime workflows and skips intact.
    if: github.repository == 'YNWAforever/KinnsoOS'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SCOPE_SOURCE_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Explain eligibility without executing runtime checks
        # Reads the event file and workflow conditions; records only allowed fields.
        # No target requests, secrets, role fixtures or provider commands.
        run: python scripts/deployment-scope.py --output evidence/deployment-scope.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deployment-scope-metadata
          path: evidence/deployment-scope.json
          if-no-files-found: error
          retention-days: 7
