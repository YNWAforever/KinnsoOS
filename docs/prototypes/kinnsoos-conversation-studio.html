 const thread={id:'thread-'+n,template:t.id,role:t.role,title:t.id==='C1'?'香港半日慢遊 guide':t.title,prompt:state.prompt||`一起完成「${t.title}」。`,sources:[...state.selected],messages:[],body,artifact:false,artifactSaved:false,artifactRevision:0,briefTitle:t.id==='C1'?'香港半日慢遊 guide':t.output,guideRevision:0,guideSaved:false,rights:[false,false],privateInclude:false,stage:'chat',command:null,receipts:[],restricted:false,publishConfirm:false,confirmedPublish:false,published:false,conflict:false};
 state.threads.push(thread);state.active=thread.id;state.view='thread';state.prompt='';state.notice='';render();
}

function threadPage(){const t=active();if(!t)return `<div class="ks-empty">還沒有討論串。${btn('從範本開始','data-view="templates"')}</div>`;const steps=['開始討論','查看證據','另開 brief','保存成果','原流程發佈'];const step=t.published?5:t.guideSaved?4:t.artifact?3:1;return `<div class="ks-work">${side()}<div class="ks-content"><div class="ks-thread-top"><div><div class="ks-eyebrow">${roles[t.role]} / 私人討論</div><h1>${esc(t.title)}</h1></div><span class="ks-tag">${names[state.persona]} · 示例</span></div><div class="ks-steps">${steps.map((s,i)=>`<span class="${i<step?'done':''}">${i<step?'✓':'○'} ${s}</span>`).join('')}</div>${t.restricted?alert('來源存取已撤銷。這串依賴的摘錄與 brief 已隱藏，不能繼續保存、重用或發佈。可返回首頁，以仍有權使用的來源開新討論。',true):t.stage==='chat'?chatContent(t):t.stage==='brief'?briefContent(t):editorContent(t)}${state.login?loginPanel():''}${state.notice?alert(esc(state.notice),true):''}${debugPanel(t)}</div></div>`;}
function chatContent(t){return `<div class="ks-message user"><small>你 · 示例提問</small><p>${esc(t.prompt)}</p></div><div class="ks-message"><small>Kinnso · 示例回覆，未呼叫 AI</small><p>${t.template==='C1'?'我們先把熟悉的地方，整理成一份好寫的 brief。\n我會分開原創筆記、私人安排和仍待查證的資訊。':'先把已選資料整理清楚，再產生可修改的草稿。這張範本目前展示入口與證據結構。'}</p></div><div class="ks-row"><span class="ks-tag">已選 ${t.sources.length} 份示例文件</span><span class="ks-tag warm">營業時間／交通：未驗證</span></div>${sourceCards(t)}<div class="ks-result"><h3>${tpl(t.template).output}</h3><p>原討論保留。你可以在獨立成果頁編輯、檢查來源，再保存。</p>${btn('另開 brief ↗','data-action="brief"',true)}</div>${t.messages.map(m=>`<div class="ks-message ${m.role==='user'?'user':''}"><small>${m.role==='user'?'你':'Kinnso · 示例回覆'}</small><p>${esc(m.text)}</p></div>`).join('')}<form id="ks-thread-form" class="ks-composer"><label for="ks-reply"><span>繼續這個主題</span><textarea id="ks-reply" placeholder="例如：把語氣寫得輕鬆一點" maxlength="1200"></textarea></label><div class="ks-compose-tools"><span class="ks-fine">只使用這串已選文件</span><button type="submit" class="ks-btn ks-primary cursor-interaction">送出示例訊息</button></div></form>`;}
function briefContent(t){return `<button class="ks-quiet cursor-interaction" data-action="back-chat">← 返回原討論（保留 brief）</button><section class="ks-panel ks-brief" aria-label="獨立 brief 成果"><div class="ks-row"><span class="ks-tag">私人 brief</span><span class="ks-tag warm">${t.artifactSaved?'示例版本 r'+t.artifactRevision:'尚未保存'}</span></div><label for="ks-brief-title">成果名稱<input id="ks-brief-title" value="${esc(t.briefTitle)}" maxlength="160"></label><label for="ks-brief-body">可以編輯的內容<textarea id="ks-brief-body" maxlength="6000">${esc(t.body)}</textarea></label><p class="ks-fine">來源：${t.sources.map(s=>'['+s+']').join(' ')} · 原討論：${esc(t.title)}。來源不足的資訊保持「未驗證」。</p>${t.sources.includes('D3')?alert('私人拍攝備忘 [D3] 只留在這份私人 brief，預設不帶到公開內容。'):''}<div class="ks-row ks-space">${btn('保存私人 brief（示例）','data-action="save-brief"',true)}${btn('準備交到 guide 編輯器','data-action="handoff"')}</div>${t.artifactSaved?`<div class="ks-receipt" data-testid="brief-receipt">示例已保存 · r${t.artifactRevision}<br>只保留在本頁記憶體；尚未存入 Kinnso。</div>`:''}</section>`;}
function handoffReview(t){return `<section class="ks-panel"><h2>選擇要公開的內容</h2><p class="ks-sub">目標：原有 guide 草稿。以下是完整移交預覽；請逐項核對。</p><div class="ks-result"><h3>${esc(t.briefTitle)}</h3><p>目的地：香港（示例）</p><div class="ks-readback">${esc(t.body)}</div></div><label class="ks-check"><input type="checkbox" data-right="0" ${t.rights[0]?'checked':''}><span>確認公開標題、受眾與創作方向 [D1]<small>此示例假設它們是自己的原創內容。</small></span></label><label class="ks-check"><input type="checkbox" data-right="1" ${t.rights[1]?'checked':''}><span>確認公開親自構思的兩段路線 [D2]<small>未驗證的時間、交通與圖片不加入公開內容。</small></span></label>${t.sources.includes('D3')?`<label class="ks-check"><input type="checkbox" id="ks-private-include" ${t.privateInclude?'checked':''}><span>帶入私人拍攝安排 [D3]<small>沒有公開授權，選取後會阻止移交。</small></span></label>`:''}${btn('確認內容，開啟原編輯流程','data-action="confirm-handoff"',true)}<p class="ks-fine ks-space">保存 brief 與發佈 guide 是兩個不同動作。下一步仍會檢查既有權限與版本。</p></section>`;}
function receipt(t){if(!t.command&&!t.receipts.length)return '';const c=t.command||t.receipts.at(-1);return `<details class="ks-receipt" open data-testid="command-receipt" data-request-id="${c.id}" data-write-count="${t.receipts.filter(x=>x.action==='save').length}"><summary>操作紀錄 · ${c.status}</summary><p>動作：${c.action==='publish'?'發布 guide':'保存 guide 草稿'}（示例）<br>Request UUID：<code>${c.id}</code><br>預期 revision：${c.expected}<br>固定內容版本：brief r${c.artifactRevision}<br>${c.status==='結果未知'?'尚未確認，重試會沿用此 UUID 與原內容。':'本頁示例讀回；不是正式服務的 receipt。'}</p></details>`;}
function editorContent(t){if(t.stage==='handoff')return handoffReview(t);return `<button class="ks-quiet cursor-interaction" data-action="return-brief">← 返回 brief</button><div class="ks-panel"><div class="ks-row"><span class="ks-tag">原有 guide 編輯流程 · 示例</span><span class="ks-tag">/${'zh-HK'}/studio/guides/:id/edit</span></div><h2 class="ks-space">${esc(t.briefTitle)}</h2><p class="ks-sub">目的地：香港（示例） · 1 個創作日 · 2 個原創站點</p><div class="ks-readback ks-space">${esc(t.body)}</div><div class="ks-result"><h3>發佈前檢查</h3><p>原創 title／city／summary／days／stops 已在示例中準備。私人備忘已排除。具體店家、交通與圖片仍待查證。</p><p>目前草稿：${t.guideSaved?'示例讀回 r'+t.guideRevision:'尚未確認保存'}。真正發佈仍由原服務重新驗權及檢查。</p></div>${t.conflict?alert('示例衝突：另一版本已保存。你的 brief 仍保留，尚未覆蓋遠端。<br>遠端示例：更新了 guide 簡介；本稿：保留你剛才的內容。<br>'+btn('已比對，準備新的保存意圖','data-action="resolve-conflict"'),true):''}${receipt(t)}<div class="ks-row">${t.command?.status==='結果未知'?btn('以相同 UUID 重試','data-action="retry"',true):btn('保存 guide 草稿（示例）','data-action="save-guide" '+(t.conflict||t.published||t.guideSaved?'disabled':''),!t.guideSaved)}${btn('預覽公開版本','data-action="preview-publish" '+(!t.guideSaved||t.command||t.published?'disabled':''),t.guideSaved)}</div></div>${t.publishConfirm&&!t.published?`<section class="ks-panel" aria-label="獨立發佈確認"><h2>這是旅人會看見的版本</h2><h3 class="ks-space">${esc(t.briefTitle)}</h3><p>香港 · 原創示例路線</p><div class="ks-readback ks-space">${esc(t.body)}</div><p class="ks-fine ks-space">私人備忘及原始文件不公開。此動作另建發布 UUID；不改旅人已採用的副本。</p><label class="ks-check"><input type="checkbox" id="ks-publish-confirm" ${t.confirmedPublish?'checked':''}><span>我已核對完整公開內容及來源權利</span></label>${btn('模擬確認發布','data-action="publish"',true)}</section>`:''}${t.published?`<section class="ks-success"><div class="ks-seal" aria-hidden="true">✓</div><h2>一份好故事，準備啟程。</h2><p class="ks-sub">你已走完創作者示例流程。</p><div class="ks-progress" role="progressbar" aria-label="示例流程進度" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"><span style="width:100%"></span></div><span class="ks-tag">示例徽章：有來源的創作</span><p class="ks-fine ks-space">示例公開版本 v1 · 沒有真實發佈或發放積分。<br>實際徽章只按可核實的成果發放，同一版本不重複計算。</p><div class="ks-row ks-space">${btn('回到共用首頁','data-view="home"')}${btn('查看原有功能','data-view="directory"')}</div></section>`:''}`;}
function debugPanel(t){return `<details class="ks-devtools"><summary>原型檢查：未知結果、衝突與撤權</summary><label>下一次示例保存結果<select id="ks-scenario"><option value="normal" ${state.scenario==='normal'?'selected':''}>正常示例讀回</option><option value="timeout" ${state.scenario==='timeout'?'selected':''}>逾時 → 結果未知</option><option value="conflict" ${state.scenario==='conflict'?'selected':''}>revision 衝突</option><option value="unavailable" ${state.scenario==='unavailable'?'selected':''}>capability 未接通</option></select></label><div class="ks-row ks-space">${btn('模擬撤銷本串來源存取','data-action="revoke-source" '+(t.restricted?'disabled':''))}</div><p>只改本頁狀態，不影響帳號、文件或服務。</p></details>`;}
function loginPanel(){return `<section class="ks-panel" aria-label="示例登入閘門"><h2>把想法留給下次旅程。</h2><p class="ks-sub">保存前需要登入。這個原型不接收帳密；正式產品會進入 Journeys 登入頁，回到原任務後再由你決定是否保存。</p>${btn('以示例創作者繼續，保留這份草稿','data-action="demo-signin"',true)}<p class="ks-fine ks-space">明確帶入目前這份示例草稿；不自動保存或發佈。</p></section>`;}
function connections(){let options=state.persona==='traveller'?['Google Calendar','Google Drive','Gmail']:state.persona==='merchant'?['Search Console','Google Calendar','WhatsApp Business','Instagram']:state.persona==='ops'?[]:['Instagram','TikTok','YouTube','Search Console','Google Drive','Telegram'];const list=['Firecrawl',...options];return `<div class="ks-title-row"><div><div class="ks-eyebrow">已連接帳號</div><h1>多一點工具，多一點靈感。</h1><p class="ks-sub">連接是自選技能。沒有連接，仍然能用自己的筆記完成任務。</p></div>${btn('回到首頁','data-view="home"')}</div>${state.persona==='guest'?alert('訪客只能預覽技能。請先登入，再由自己授權個人帳號。'):''}${state.persona==='ops'?alert('Ops 沿用原有監控與審核權限，不繼承其他人的個人帳號授權。'):''}<div class="ks-connect-grid">${list.map(name=>{const drive=name==='Google Drive',connected=drive&&state.connectedSample;return `<article class="ks-template"><div class="ks-connect-status"><h3>${name}</h3><span class="ks-tag ${connected?'warm':''}">${connected?'示例已連接':drive&&state.connectionRevoked?'示例已撤銷':'未連接'}</span></div><p>${name==='Firecrawl'?'公開頁面證據':name==='Gmail'?'選定信件唯讀；不設發信':name==='WhatsApp Business'?'商戶已確認使用；API／MCP 資格未驗證':name==='Search Console'?'自己的網站與選定期間':name==='Google Calendar'?'選定日曆與必要時段':name==='Google Drive'?'只使用自己明選的文件':'本人帳號的選定內容／訊號'}</p><dl class="ks-meta"><dt>授權範圍</dt><dd>${connected?'示例：明選文件唯讀':'未授權'}</dd><dt>最後同步</dt><dd>${connected?'示例：2026-10-28 14:30':'未同步'}</dd></dl><details class="ks-evidence"><summary>範圍與使用方式</summary><p>預設唯讀、最小範圍。成果預設私人。${name==='Gmail'?'Gmail 保持唯讀。':'發佈、傳訊或改日曆須另外授權，先完整預覽並確認。'}<br>實際 provider scopes、條款、帳號資格與工具可用性尚未驗證。</p></details>${drive&&state.persona!=='guest'?(connected?btn('撤銷示例授權','data-action="disconnect"'):btn('查看已連接狀態示例','data-action="sample-connect"')):btn('用手動文件繼續','data-view="templates"')}</article>`}).join('')}</div>${state.notice?alert(esc(state.notice)):''}`;}
function directory(){return `<div class="ks-title-row"><div><div class="ks-eyebrow">熟悉的工具，一直都在</div><h1>所有原有功能</h1><p class="ks-sub">這裏展示新入口如何保留原路徑。點選可查看交接位置。</p></div>${btn('回到共用首頁','data-view="home"')}</div><div class="ks-directory">${groups.filter(g=>g[0]!=='營運'||state.persona==='ops').map(([title,items])=>`<section><h3>${title}</h3>${items.map(([id,label,path])=>`<button class="cursor-interaction" data-directory="${id}"><span>${label}</span><code>${path}</code></button>`).join('')}</section>`).join('')}</div>`;}
function retained(){const item=groups.flatMap(g=>g[1]).find(i=>i[0]===state.retained)||groups[0][1][0];return `<div class="ks-title-row"><div><button class="ks-quiet cursor-interaction" data-view="directory">← 所有功能</button><h1>${item[1]}</h1></div><span class="ks-tag">原有功能入口預覽</span></div><section class="ks-panel"><h2>保留原流程，從這裏直接進入。</h2><p class="ks-sub">既有位置：<code>${item[2]}</code></p>${alert(state.retained==='commerce'?'訂位與付款保持關閉。任何新連接都不會開啟它們。':state.retained==='credits'?'保留 Journeys 的 GPL-3.0、AdventureLog 來源標示及對應來源下載；第三方內容權利仍未解決。':state.retained==='web'?'原 Kinnso 網站獨立驗證登入。此原型不傳遞 cookie、token 或私人文件。':state.retained==='ops'||state.retained==='monitoring'?'真正進入前，server 必須驗證 DB ops 角色與原有物件權限。':'正式產品會進入這個既有工作區，沿用原有權限與資料。此概念原型只展示交接位置。')}<div class="ks-row">${btn('回到共用提問','data-view="home"',true)}${btn('選擇相關範本','data-view="templates"')}</div></section>`;}
function documents(){return `<div class="ks-title-row"><div><h1>文件與來源</h1><p class="ks-sub">只使用明確選取的資料。摘要也會繼承來源權限。</p></div>${btn('回到討論','data-view="thread"')}</div>${active()?.restricted?alert('目前討論的來源存取已撤銷；原摘錄及衍生成果已限制使用。',true):sourceCards({sources:docs.map(d=>d.id)})}<p class="ks-fine">全部為固定示例，沒有讀取你的裝置、Drive、郵件或私人媒體。</p>`;}
function account(){return `<section class="ks-panel"><h1>${names[state.persona]}</h1><p class="ks-sub">這是原型預覽身份。正式產品的角色由資料庫驗證，不能自行切換取得。</p>${state.persona==='guest'?loginPanel():`<div class="ks-row ks-space">${btn('已連接帳號','data-view="connections"',true)}${btn('所有功能','data-view="directory"')}</div>`}<p class="ks-fine ks-space">Journeys 與原 Kinnso 網站各自登入，沒有跨站 SSO。</p></section>`;}
function render(){
 const previousFocus=document.activeElement,restoreFocus=main.contains(previousFocus),previousAction=previousFocus?.dataset?.action;
 frame.classList.toggle('is-mobile',state.device==='mobile');root.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===state.device)));root.querySelector('#ks-persona').value=state.persona;root.querySelector('#ks-account').textContent=state.persona==='guest'?'登入／建立帳戶':names[state.persona]+'・示例';
 const views={home,templates:templatesPage,template:templatePage,thread:threadPage,connections,directory,retained,documents,account};main.innerHTML=(views[state.view]||home)();
 root.querySelectorAll('button').forEach(b=>{b.type='button';b.classList.add('cursor-interaction');});const hf=root.querySelector('#ks-home-form button[type="button"].ks-primary');if(hf)hf.type='submit';const rf=root.querySelector('#ks-thread-form .ks-primary');if(rf)rf.type='submit';
 if(restoreFocus){
  const same=previousAction?main.querySelector('[data-action="'+previousAction+'"]:not(:disabled)'):null;
  const next=main.querySelector('#ks-publish-confirm')||same||main.querySelector('[data-action=start], #ks-brief-title, [data-right="0"], .ks-content [data-evidence] summary, [data-action=save-guide]:not(:disabled), [data-action=preview-publish]:not(:disabled), #ks-home-prompt')||main.querySelector('.ks-content button:not(:disabled),button:not(:disabled)');
  if(next)next.focus({preventScroll:true});
 }
}
function sourceAllowed(t){if(t.restricted){say('來源已撤銷，不能重用或保存衍生成果。');return false;}return true;}
function creatorAllowed(t){if(!sourceAllowed(t))return false;if(state.persona!=='creator'){say('這個 guide 操作需要 DB 驗證的創作者與本人攻略權限；選範本不會授權。可在上方切換示例身份重新試走。');return false;}return true;}
function saveGuide(t,retry=false){if(!creatorAllowed(t)||t.conflict)return;if(state.scenario==='unavailable'){say('creator capability 未接通。保留 brief，回到原有編輯器；沒有送出操作。');return;}if(t.command&&!retry){say('上次結果仍未知，請使用相同 UUID 重試。');return;}if(!t.command)t.command={id:uid(),action:'save',expected:t.guideRevision,artifactRevision:t.artifactRevision,body:t.body,title:t.briefTitle,status:'等待示例回應'};if(state.scenario==='timeout'&&!retry){t.command.status='結果未知';say('結果未知：保留同一個 request UUID、版本及內容。');return;}if(state.scenario==='conflict'&&!retry){t.command=null;t.conflict=true;t.guideSaved=false;say('版本衝突，請先比對；本稿已保留。');return;}t.guideRevision++;t.guideSaved=true;t.command.status='示例讀回一致';t.receipts.push({...t.command});t.command=null;say('示例 guide 草稿已讀回。這不是正式資料保存。');}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;if(b.dataset.device){state.device=b.dataset.device;render();return;}if(b.dataset.view){move(b.dataset.view);return;}if(b.dataset.template){selectTemplate(b.dataset.template);return;}if(b.dataset.tab){state.tab=b.dataset.tab;render();return;}if(b.dataset.directory){state.retained=b.dataset.directory;move('retained');return;}if(b.dataset.thread){state.active=b.dataset.thread;move('thread');return;}const a=b.dataset.action,t=active();if(!a)return;state.notice='';switch(a){case'home-docs':state.showDocs=!state.showDocs;break;case'start':start();return;case'brief':if(sourceAllowed(t)){t.artifact=true;t.stage='brief';}break;case'back-chat':t.stage='chat';break;case'return-brief':if(t.command){say('保存結果仍未知，請先用相同 UUID 取得結果。');break;}t.stage='brief';t.publishConfirm=false;break;case'save-brief':if(!sourceAllowed(t))break;if(state.persona==='guest'){state.login=true;say('保存需要登入；沒有寫入任何資料。');break;}t.artifactSaved=true;t.artifactRevision++;say('私人 brief r'+t.artifactRevision+' 已在示例記憶體中保存。');break;case'handoff':if(!creatorAllowed(t))break;if(t.template!=='C1'){say('此範本的正式交接留待下一階段。本次完整示例是 C1 guide brief。');break;}if(!t.artifactSaved){say('請先保存目前的私人 brief，再核對公開內容。');break;}t.stage='handoff';break;case'confirm-handoff':if(!creatorAllowed(t))break;if(t.privateInclude){say('私人拍攝備忘沒有公開授權。請排除此項，不能用一次確認取代來源權限。');break;}if(!t.rights.every(Boolean)){say('請逐項核對兩組要公開的原創內容。');break;}t.stage='editor';break;case'save-guide':saveGuide(t);break;case'retry':saveGuide(t,true);break;case'resolve-conflict':t.guideRevision++;t.conflict=false;t.command=null;state.scenario='normal';say('已比對兩個示例版本。再次保存會建立新的意圖與 UUID。');break;case'preview-publish':if(creatorAllowed(t)&&t.guideSaved&&!t.command){t.publishConfirm=true;t.confirmedPublish=false;}break;case'publish':if(!creatorAllowed(t)||!t.guideSaved||t.command)break;if(!t.confirmedPublish){say('請先確認完整公開內容與來源權利。');break;}if(state.scenario==='unavailable'){say('creator capability 未接通，不能發布。');break;}t.receipts.push({id:uid(),action:'publish',expected:t.guideRevision,artifactRevision:t.artifactRevision,status:'示例公開版本 v1'});t.published=true;t.publishConfirm=false;say('創作者示例流程完成；沒有真實發布。');break;case'revoke-source':t.restricted=true;t.confirmedPublish=false;t.publishConfirm=false;t.command=null;say('示例來源已撤權，衍生內容停止重用。');break;case'demo-signin':state.persona='creator';state.login=false;say('已明確帶入目前這份草稿至示例創作者；請自行按保存。');break;case'sample-connect':state.connectedSample=true;state.connectionRevoked=false;say('只切換畫面示例，沒有建立 OAuth 或 MCP 連接。');break;case'disconnect':state.connectedSample=false;state.connectionRevoked=true;say('示例授權已撤銷，停止後續讀取。沒有操作真實帳號。');break;}render();});
root.addEventListener('change',e=>{const el=e.target;if(el.id==='ks-persona'){state.persona=el.value;state.threads=[];state.active=null;state.view='home';state.notice='';state.prompt='';state.selected=['D1','D2'];state.connectedSample=false;state.connectionRevoked=false;state.scenario='normal';state.login=false;state.tab=['guest','traveller'].includes(state.persona)?'traveller':state.persona;render();say('已切換示例身份並清除上一身份的私人工作內容。');}else if(el.dataset.doc){state.selected=el.checked?[...new Set([...state.selected,el.dataset.doc])]:state.selected.filter(x=>x!==el.dataset.doc);}else if(el.dataset.right!==undefined){active().rights[Number(el.dataset.right)]=el.checked;}else if(el.id==='ks-private-include'){active().privateInclude=el.checked;}else if(el.id==='ks-scenario'){state.scenario=el.value;}else if(el.id==='ks-publish-confirm'){active().confirmedPublish=el.checked;}});
root.addEventListener('input',e=>{const el=e.target;if(el.id==='ks-home-prompt')state.prompt=el.value;if(el.id==='ks-brief-title'||el.id==='ks-brief-body'){const t=active();if(el.id==='ks-brief-title')t.briefTitle=el.value;else t.body=el.value;t.artifactSaved=false;t.guideSaved=false;t.rights=[false,false];t.published=false;t.publishConfirm=false;t.confirmedPublish=false;const badge=root.querySelector('.ks-brief .ks-tag.warm');if(badge)badge.textContent='有修改待保存';const receiptNode=root.querySelector('[data-testid=brief-receipt]');if(receiptNode)receiptNode.textContent='較早示例版本 r'+t.artifactRevision+' 保留；目前修改尚未保存。';}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='ks-home-form'){const q=state.prompt.trim();if(!q){say('輸入一個想法，或從下方選一張任務卡。');return;}const creator=/guide|創作|寫|發佈|發布|brief/i.test(q),merchant=/商戶|小店|查詢|活動|客人|店舖|營運/.test(q);if(creator&&merchant){state.view='templates';state.tab=state.persona==='merchant'?'merchant':'creator';say('這個問題包含創作和商戶工作。請先選一張範本，分開討論。');render();return;}selectTemplate(merchant?'M3':creator?'C1':'T1');}else if(e.target.id==='ks-thread-form'){const input=root.querySelector('#ks-reply'),text=input.value.trim(),t=active();if(!text||!sourceAllowed(t))return;t.messages.push({role:'user',text},{role:'assistant',text:'示例：這個想法已留在本討論。你可以在 brief 修改文字；新修改會重新要求保存與公開內容確認。'});render();}});
render();
})();
</script>
